<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TYT Kampı</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TYT Kampı"><meta name="theme-color" content="#0b0820">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap">
</head><body>
<style>
@property --a1{syntax:"<color>";inherits:true;initial-value:#6d3cff}
/* Layout: tek koyu dünya — gece moru zemin, yavaş kayan neon ışık lekeleri, buzlu cam kartlar; altta cam sekme çubuğu */
:root{--a1:#6d3cff;transition:--a1 2.5s ease;--bg:#0b0820;--fg:#ffffff;--muted:rgba(255,255,255,.62);--faint:rgba(255,255,255,.14);--glass:rgba(255,255,255,.075);--glass2:rgba(255,255,255,.13);--edge:rgba(255,255,255,.16);
  --acc:#a98bff;--acc2:#ff5fa2;--ok:#3ddc84;--ink:#0b0820;--font:"Sora",system-ui,-apple-system,sans-serif;--spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.22,1,.36,1);color-scheme:dark}
html{overflow-x:hidden;background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:clip;min-height:100%}
.aur{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;filter:blur(10px)}
.aur{transition:opacity 2s,filter 2s}
.night .aur{opacity:.45;filter:blur(18px) saturate(.7)}
.night{--acc:#9c86e8;--acc2:#e46a9c}
.night .glass,.night .wcard,.night .wrow{background:rgba(255,255,255,.055)}
.aur i{position:absolute;border-radius:50%;opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.aur i:nth-child(1){width:70vmax;height:70vmax;left:45%;top:-30%;background:radial-gradient(closest-side,var(--a1),transparent)}
.aur i:nth-child(2){width:60vmax;height:60vmax;left:-30%;top:25%;background:radial-gradient(closest-side,#ff3d7f,transparent);opacity:.35;animation-duration:28s}
.aur i:nth-child(3){width:60vmax;height:60vmax;left:40%;top:60%;background:radial-gradient(closest-side,#00d1b2,transparent);opacity:.3;animation-duration:34s}
@keyframes drift{to{transform:translate(-8%,6%) scale(1.12)}}
.wrap{position:relative;z-index:1;max-width:600px;margin:0 auto;padding-block:16px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;letter-spacing:-.03em;text-wrap:balance}
p{margin:0}.muted{color:var(--muted)}.small{font-size:13px}
.eb{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;cursor:pointer;color:inherit;border:0;background:none;padding:0;-webkit-user-select:none;user-select:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:14px}
.num{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.04em}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:26px;-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.top h1{font-size:26px;font-weight:800;line-height:1.05}
.wkpill{display:flex;align-items:center;gap:6px;background:var(--glass2);border:1px solid var(--edge);border-radius:999px;padding:6px 6px 6px 14px;font-weight:600;font-size:13px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.wkpill b{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:999px;padding:3px 10px;font-weight:800}
.view{display:flex;flex-direction:column;gap:16px}
.view.in{animation:vin .5s var(--ease) both}.view.in.l{animation-name:vinl}
@keyframes vin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes vinl{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.st{animation:up .55s var(--ease) both;animation-delay:calc(var(--i,0)*50ms)}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.still .st{animation:none}
/* nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;background:rgba(30,22,60,.55);border:1px solid var(--edge);border-radius:999px;padding:6px;display:flex;gap:2px;-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 12px 40px rgba(0,0,0,.45)}
nav .ind{position:absolute;top:6px;bottom:6px;left:6px;border-radius:999px;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 24px rgba(169,139,255,.6);transition:transform .5s var(--spring),width .5s var(--spring)}
nav button{position:relative;z-index:1;padding:11px 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);transition:color .3s}
nav button[aria-current="page"]{color:#fff}
/* gün şeridi */
.strip{position:relative;display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr)) 30px;gap:2px;align-items:center;padding:8px 6px}
.strip .arr{height:56px;border-radius:14px;color:var(--muted);font-size:20px}
.dd{position:relative;z-index:1;height:56px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted);transition:color .3s}
.dd small{font-size:11px;font-weight:600}
.dd b{font-size:18px;font-weight:700;color:var(--fg)}
.dd i{width:5px;height:5px;border-radius:50%;background:transparent;transition:background .3s}
.dd i.full{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dd i.part{background:var(--muted)}
.dd.today b{color:var(--acc)}
.dd[aria-pressed="true"]{color:#fff}.dd[aria-pressed="true"] b{color:#fff}
.strip .sel{position:absolute;top:8px;height:56px;border-radius:16px;background:var(--glass2);border:1px solid var(--edge);transition:transform .5s var(--spring);z-index:0}
/* şimdi */
.glass.now{padding:20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.glass.now::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(closest-side,var(--dc,var(--acc)),transparent);opacity:.35;pointer-events:none}
.glass.now small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.glass.now h2{font-size:32px;font-weight:800;line-height:1.05;background:linear-gradient(90deg,#fff,var(--dc,var(--acc)) 140%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:2px}
.glass.now .sub{color:var(--muted);font-weight:600}
.glass.now .bar{height:8px;border-radius:8px;background:var(--faint);overflow:hidden;margin-top:8px}
.glass.now .bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--dc,var(--acc)),#fff);box-shadow:0 0 14px var(--dc,var(--acc));transition:width 1s var(--ease)}
.dotlive{width:8px;height:8px;border-radius:50%;background:var(--acc2);box-shadow:0 0 10px var(--acc2);animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.25}}
.dprog{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:20px}
.dprog .bar{flex:1;height:8px;border-radius:8px;background:var(--faint);overflow:hidden}
.dprog .bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .7s var(--spring)}
/* liste */
.list{overflow:hidden}
.rw{border-top:1px solid rgba(255,255,255,.09);transition:background .3s}
.rw:first-child{border-top:0}
.rw.live{background:rgba(255,255,255,.06)}
.rmain{display:flex;align-items:center;gap:6px;padding:0 14px 0 0}
.rw .main{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:14px 0 14px 16px;text-align:left}
.ic{width:46px;height:46px;border-radius:15px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--ink);background:linear-gradient(135deg,var(--dc),#fff 130%);box-shadow:0 6px 20px color-mix(in srgb,var(--dc) 45%,transparent);transition:transform .4s var(--spring),filter .3s}
.rw.on .ic{filter:grayscale(.8) brightness(.7);transform:scale(.92)}
.tx{min-width:0;display:flex;flex-direction:column}
.tx b{font-size:16px;font-weight:700;line-height:1.25;transition:color .3s}
.tx span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw.on .tx b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--dc)}
.lv{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--acc2);padding:3px 8px;border-radius:999px;box-shadow:0 0 12px var(--acc2);flex:none}
.ck{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;position:relative}
.ck::before{content:"";width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.35);transition:background .3s,border-color .3s,transform .45s var(--spring),box-shadow .3s}
.rw.on .ck::before{background:var(--ok);border-color:var(--ok);transform:scale(1.08);box-shadow:0 0 16px rgba(61,220,132,.7)}
.rw.on .ck::after{content:"";position:absolute;width:10px;height:5px;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(-45deg) translate(1px,-1px)}
.rw.pop .ck::before{animation:pp .5s var(--spring)}
@keyframes pp{40%{transform:scale(1.35)}}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.rw.op .more{grid-template-rows:1fr}
.more>div{overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:0 16px 0 76px}
.rw.op .more>div{padding-bottom:14px}
.more p{font-size:13px;color:var(--muted)}
.lnk{align-self:flex-start;color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:9px 14px;border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--dc) 70%,transparent),rgba(255,255,255,.08));border:1px solid var(--edge)}
.hint{text-align:center;font-size:12px;color:var(--muted)}
/* hafta */
.car{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:-16px;padding:4px 16px 8px}
.car::-webkit-scrollbar{display:none}
.wcard{flex:none;width:72%;max-width:330px;scroll-snap-align:center;border-radius:26px;padding:18px;background:var(--glass);border:1px solid var(--edge);display:flex;flex-direction:column;gap:12px;text-align:left;-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);transition:transform .45s var(--spring),background .3s,border-color .3s,box-shadow .3s;transform:scale(.94)}
.wcard.sel{transform:none;background:linear-gradient(145deg,rgba(169,139,255,.35),rgba(255,95,162,.18));border-color:rgba(255,255,255,.3);box-shadow:0 10px 40px rgba(109,60,255,.35)}
.wcard .r{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.wcard .big{font-size:50px;line-height:.9}
.wcard svg{width:58px;height:58px;transform:rotate(-90deg);flex:none}
.wcard .now{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc2)}
.wdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--muted)}
.wd i{width:100%;height:6px;border-radius:4px;background:var(--faint);transition:background .3s}
.wd i.part{background:rgba(169,139,255,.55)}.wd i.full{background:var(--ok);box-shadow:0 0 8px rgba(61,220,132,.6)}
.wfin{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;min-width:0}
.wfin span:last-child{overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dc);flex:none;box-shadow:0 0 8px var(--dc)}
.wl2{display:flex;flex-direction:column;gap:10px}
.wrow{padding:14px 16px;display:flex;flex-direction:column;gap:4px;background:var(--glass);border:1px solid var(--edge);border-radius:22px;-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.wrow .wt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wrow .nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.wrow .wv{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.wrow .wh2{font-size:12px;color:var(--muted)}
.fin{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--dc);padding:3px 8px;border-radius:999px;box-shadow:0 0 12px var(--dc)}
.pips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pip{min-width:44px;height:36px;padding:0 8px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--edge);font-size:12px;font-weight:700;color:var(--muted);transition:background .3s,color .3s,transform .35s var(--spring),box-shadow .3s}
.pip:active{transform:scale(.9)}
.pip.on{background:var(--dc);color:var(--ink);border-color:transparent;box-shadow:0 0 14px color-mix(in srgb,var(--dc) 60%,transparent)}
/* plan */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:16px;background:var(--glass);border:1px solid var(--edge);border-radius:24px;-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.stat .num{font-size:34px;line-height:1;display:block;background:linear-gradient(90deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.gantt{padding:16px 12px 14px;overflow-x:auto;background:var(--glass);border:1px solid var(--edge);border-radius:24px;-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.gg{display:grid;grid-template-columns:78px repeat(13,minmax(16px,1fr));row-gap:10px;column-gap:2px;align-items:center;min-width:320px}
.gg .wh{font-size:10px;font-weight:700;color:var(--muted);text-align:center;border-radius:6px;padding:2px 0}
.gg .wh.cur{background:var(--acc2);color:#fff;box-shadow:0 0 10px var(--acc2)}
.gg .sn{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap}
.gb{height:20px;border-radius:999px;background:color-mix(in srgb,var(--dc) 22%,transparent);position:relative;overflow:hidden;transform-origin:left;animation:grow .9s var(--ease) both;animation-delay:calc(var(--i)*70ms)}
.gb i{position:absolute;inset:0 auto 0 0;background:var(--dc);border-radius:999px;box-shadow:0 0 12px var(--dc);transition:width .7s var(--ease)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ms{display:flex;flex-direction:column}
.mi{display:grid;grid-template-columns:62px 18px minmax(0,1fr);gap:10px;align-items:center;padding:10px 0}
.mi .w{font-weight:800;font-size:14px;color:var(--muted)}
.mi .nd{width:14px;height:14px;border-radius:50%;border:3px solid var(--dc);box-shadow:0 0 10px var(--dc)}
.mi.past .nd{background:var(--dc)}
.mi .tx{font-weight:600}
.note{padding:14px 16px;font-size:13px;color:var(--muted);background:var(--glass);border:1px solid var(--edge);border-radius:20px}
/* soru */
.btns{display:flex;gap:8px;flex-wrap:wrap}
button.lnk{font:inherit;font-weight:700;font-size:13px;color:#fff}
.qhero{padding:20px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.qhero::after{content:"";position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(closest-side,#ffd166,transparent);opacity:.25}
.qbig{font-size:72px;line-height:1;background:linear-gradient(90deg,#fff,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent}
.qsub{display:flex;gap:16px;color:var(--muted);font-size:14px}.qsub b{color:#fff}
.qadd{margin-top:12px;min-height:54px;border-radius:18px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 10px 30px rgba(255,95,162,.35);transition:transform .3s var(--spring)}
.qadd:active,.save:active{transform:scale(.96)}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:18px}
.seg .sind{position:absolute;top:4px;bottom:4px;left:4px;border-radius:14px;background:var(--glass2);border:1px solid var(--edge);transition:transform .45s var(--spring),width .45s var(--spring)}
.seg button{position:relative;z-index:1;min-height:42px;font-weight:700;color:var(--muted);transition:color .3s}
.seg button[aria-pressed="true"]{color:#fff}
.qnav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;text-align:center}
.qnav .arr{height:44px;border-radius:14px;font-size:22px;color:var(--muted)}
.qt{font-size:26px}
.qempty{padding:28px 20px;display:flex;flex-direction:column;gap:6px;text-align:center;color:var(--muted)}.qempty b{color:#fff;font-size:17px}
.qchart{height:190px;padding:16px 12px 10px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end}
.qcol{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.qstack{width:100%;max-width:30px;min-height:3px;border-radius:9px;overflow:hidden;display:flex;flex-direction:column-reverse;background:var(--faint);transform-origin:bottom;animation:gy .7s var(--ease) both}
.qstack i{display:block;min-height:2px}
@keyframes gy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.qv{font-size:11px;font-weight:700;color:var(--muted)}.ql{font-size:11px;font-weight:600;color:var(--muted)}
.qbox{padding:16px;display:flex;flex-direction:column;gap:10px}
.qshare{display:flex;height:12px;border-radius:8px;overflow:hidden;gap:2px}
.qrow{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:10px;align-items:center}
.qn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.qb{height:8px;border-radius:8px;background:var(--faint);overflow:hidden}.qb i{display:block;height:100%;width:0;border-radius:8px;background:var(--dc);box-shadow:0 0 10px var(--dc);transition:width .8s var(--ease)}
.qrow .num,.qk .num,.qe .num{text-align:right;font-size:17px}
.qk,.qe{display:grid;grid-template-columns:10px minmax(0,1fr) 48px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid rgba(255,255,255,.07)}
.qe{grid-template-columns:44px minmax(0,1fr) 40px 36px}
.qe .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kn{font-weight:700;font-size:14px;min-width:0;display:flex;flex-direction:column;line-height:1.3}.kn small{font-size:11px;color:var(--muted);font-weight:600}
.qmore{color:var(--acc);font-weight:700;font-size:13px;padding:8px 0;text-align:left}
.qe .x{height:36px;border-radius:10px;color:var(--muted);font-size:20px}
.ov{position:fixed;inset:0;z-index:60;background:rgba(5,3,15,.6);opacity:0;transition:opacity .35s}.ov.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;background:rgba(24,16,52,.92);border-top:1px solid var(--edge);border-radius:30px 30px 0 0;-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);transform:translateY(100%);transition:transform .5s var(--ease)}
.sheet.on{transform:none}
.grab{width:46px;height:5px;border-radius:5px;background:rgba(255,255,255,.3);margin:10px auto 6px;flex:none}
.sheet .in{overflow-y:auto;overscroll-behavior:contain;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;max-width:600px;width:100%;margin:0 auto;box-sizing:border-box}
.sheet h2{font-size:24px;font-weight:800}
.fld{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--edge);font-weight:600;font-size:14px;transition:background .25s,color .25s,transform .3s var(--spring)}
.chip:active{transform:scale(.94)}
